<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stub visual</title>
<style>body{font-family:sans-serif;margin:16px}</style>
</head>
<body>
<h1>Stub visual</h1>
<p>Placeholder content for the embed demo.</p>
<script>
function send() {
  parent.postMessage({type: "visual-height", px: Math.ceil(document.documentElement.scrollHeight)}, "*");
}
addEventListener("load", function () { parent.postMessage({type: "visual-ready"}, "*"); send(); });
addEventListener("resize", send);
</script>
</body>
